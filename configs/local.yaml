# The configuration the case study runs:
#
#   docker compose up -d redis postgres && make migrate
#   go run ./cmd/gateway --node gateway-1 --config ./configs/local.yaml
#
# Every value here has a default in internal/config; this file exists to be
# read, so it sets them explicitly. An unknown key is a startup error rather
# than a silently ignored typo.
#
# No secret appears in this file. The two that exist -- the JWT signing key and
# the admin API token -- are named by environment variable below, because this
# file is committed to a public repository and a config format that accepts an
# inline secret will eventually be given one.

node:
  id: gateway-1
  http_addr: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  shutdown_grace: 10s

limiter:
  # redis: counters live in Redis, so every replica enforces ONE quota. The
  # alternative, `memory`, keeps them in the process -- fine for a single node,
  # and wrong for a cluster, where N replicas would each admit the whole limit.
  #
  # This is why `docker compose up -d redis postgres` comes first: the gateway
  # refuses to start if it cannot load its script into Redis.
  backend: redis
  sweep_interval: 30s

redis:
  # 127.0.0.1 rather than localhost, deliberately. On a dual-stack machine
  # `localhost` resolves to ::1 first, and anything holding the IPv6 socket --
  # a container port forwarder, say -- will accept the connection and then
  # never answer, which surfaces as an i/o timeout rather than as a refusal.
  addr: "127.0.0.1:6379"
  pool_size: 64
  timeout: 250ms

postgres:
  # The policy store. `docker compose up -d redis postgres` starts it and
  # `make migrate` creates the schema and seeds the two demonstration tenants
  # this page's commands use, acme and globex.
  dsn: "postgres://gateway:gateway@127.0.0.1:5432/gateway?sslmode=disable"

policy:
  # postgres: tenants, policies and API keys live in the database, and can be
  # changed through the admin API while the gateway runs.
  #
  # The alternative, `static`, reads them from a `policies:` block in this file
  # and needs no database at all -- see scripts/testdata/smoke.yaml for that
  # shape. It is how the gateway runs in a test, and how it would run in a
  # deployment whose policies are managed as configuration.
  store: postgres

  # How long a policy is served before it is re-read. With change
  # notifications on this is the bound only when the listener is down: an edit
  # normally reaches every replica within milliseconds, because the schema's
  # triggers publish on a Postgres channel and each node listens.
  cache_ttl: 5s
  # "No such tenant" is an answer too, and caching it stops a flood of requests
  # for an unknown tenant becoming a flood of queries. Shorter, so a tenant
  # that was just created starts working quickly.
  negative_cache_ttl: 1s
  # If the policy store becomes unreachable, keep serving the last known
  # policies for this long rather than failing every request. A database
  # outage then freezes policy instead of stopping enforcement.
  stale_for: 5m
  listen_for_changes: true

auth:
  # Resolve the tenant from an API key issued by `gatewayctl apikey create`.
  # The store holds only a SHA-256 of each key.
  api_keys: true
  # HS256 bearer tokens. With the variable unset, JWT authentication is off.
  jwt_secret_env: GATEWAY_JWT_SECRET
  jwt_tenant_claim: tid
  # The admin API refuses every request unless this variable is set, because a
  # management surface with no credential is worse than no management surface.
  admin_token_env: GATEWAY_ADMIN_TOKEN

check_api:
  # The decision endpoint falls back to X-Tenant-ID when a request carries no
  # credentials. That is right for a limiter called by trusted infrastructure
  # -- an ingress asking "may this request through?" -- and wrong for traffic
  # off the internet, where anything that can reach the endpoint could name any
  # tenant and spend its quota. Credentials, when present, always win.
  trust_tenant_header: true
