name: CI

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  build:
    name: Build, vet and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Tests (race)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_ADDR: 127.0.0.1:6379
      # Without this, a runner with no Redis would SKIP the differential test
      # against the Lua script and still report the suite green -- the failure
      # mode where CI passes because the interesting tests did not run.
      REDIS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # -count=1 defeats the test cache: a suite that reports "ok (cached)" on
      # a runner has not run on that runner.
      - name: go test -race
        run: go test ./... -race -count=1

  smoke:
    name: Smoke (real process, real socket)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gateway smoke
        run: ./scripts/gateway-smoke.sh

  dual-node:
    name: Two nodes, one Redis, one quota
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Runs the shared-quota scenario and, as its control, the same scenario
      # with per-process counters -- which is required to over-admit.
      - name: dual-node quota
        run: ./scripts/dual-node-quota.sh --requests 1000

  case-study:
    name: The commands the case study publishes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The development machine's Docker is Windows-side and unreachable from
      # the Linux shell the scripts run in, so the compose step can only be
      # exercised here. A published command nobody runs is a published command
      # that does not work.
      - name: published commands, with docker
        run: ./scripts/case-study-commands-test.sh --with-docker
