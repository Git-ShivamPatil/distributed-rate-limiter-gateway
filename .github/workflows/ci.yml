name: CI

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  build:
    name: Build, vet and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Tests (race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # -count=1 defeats the test cache: a suite that reports "ok (cached)" on
      # a runner has not run on that runner.
      - name: go test -race
        run: go test ./... -race -count=1

  smoke:
    name: Smoke (real process, real socket)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gateway smoke
        run: ./scripts/gateway-smoke.sh

  case-study:
    name: The commands the case study publishes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The development machine's Docker is Windows-side and unreachable from
      # the Linux shell the scripts run in, so the compose step can only be
      # exercised here. A published command nobody runs is a published command
      # that does not work.
      - name: published commands, with docker
        run: ./scripts/case-study-commands-test.sh --with-docker
