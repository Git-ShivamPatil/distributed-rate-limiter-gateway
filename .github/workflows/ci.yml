name: CI

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  build:
    name: Build, vet and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # The fault-injection build is how every "this mechanism is load-bearing"
      # claim gets its control, so it has to keep compiling even though nothing
      # ships it.
      - name: the fault-injection build still compiles
        run: go build -tags faultinject ./... && go vet -tags faultinject ./...
      # A fault-injection seam that shipped would be a quota-bypass primitive.
      # The faults live behind a build tag, and this is the assertion that they
      # stayed there -- with its own control, because a check for an absent
      # symbol passes just as happily when the symbol was renamed.
      - name: no fault-injection seam in a production binary
        run: |
          go build -o /tmp/gateway-prod ./cmd/gateway
          go build -tags faultinject -o /tmp/gateway-fault ./cmd/gateway
          if go tool nm /tmp/gateway-prod | grep -q 'decide.FaultPreCheck'; then
            echo "the production binary carries a fault-injection hook"
            exit 1
          fi
          if ! go tool nm /tmp/gateway-fault | grep -q 'decide.FaultPreCheck'; then
            echo "the fault-injection binary does not carry the hook either,"
            echo "so the check above proves nothing -- it was renamed or removed"
            exit 1
          fi

  proto:
    name: Generated code is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: install the protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: buf lint
        run: buf lint
      # Generated code is committed so that `go build` needs no protobuf
      # toolchain. This is what keeps the committed copy honest: regenerate,
      # and fail if anything moved.
      - name: generated code matches the proto
        run: |
          buf generate
          git diff --exit-code -- api/gen

  test:
    name: Tests (race)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_ADDR: 127.0.0.1:6379
      POSTGRES_DSN: postgres://gateway:gateway@127.0.0.1:5432/gateway?sslmode=disable
      # Without these, a runner with no data plane would SKIP the tests that
      # exercise the Lua script and the policy store, and still report the
      # suite green -- the failure mode where CI passes because the
      # interesting tests did not run.
      REDIS_REQUIRED: "1"
      POSTGRES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # -count=1 defeats the test cache: a suite that reports "ok (cached)" on
      # a runner has not run on that runner.
      - name: go test -race
        run: go test ./... -race -count=1

  smoke:
    name: Smoke (real process, real socket)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # grpcurl so the smoke test exercises the published gRPC command rather
      # than skipping it.
      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
      - name: gateway smoke
        run: PATH=$PATH:$(go env GOPATH)/bin ./scripts/gateway-smoke.sh

  dual-node:
    name: Two nodes, one Redis, one quota
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Runs the shared-quota scenario and, as its control, the same scenario
      # with per-process counters -- which is required to over-admit.
      - name: dual-node quota
        run: ./scripts/dual-node-quota.sh --requests 1000

  policy-reload:
    name: A policy edit reaches another node
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Both halves: the edit propagating, and the control with notifications
      # off that must NOT see it.
      - name: policy reload
        run: ./scripts/policy-reload-test.sh

  cluster:
    name: Three nodes, one ring, one quota
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Checks both claims separately: that the quota is shared (which would
      # hold even with the ring removed, because Redis is authoritative) and
      # that forwarding actually happened (which is the only thing that shows
      # the ring is doing anything).
      - name: cluster quota
        run: ./scripts/cluster-quota-test.sh

  leader-kill:
    name: Killing the leader is an election, not an outage
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Three nodes, continuous traffic, SIGKILL the leader mid-flight: a new
      # leader takes over and the quota still comes out exactly.
      - name: leader kill
        run: ./scripts/kill-leader.sh
      # The control. Claim 2 of that script would hold with no consensus in the
      # system at all, so the same scenario runs against a build that puts
      # consensus ON the request path, where it is REQUIRED to break. Without
      # this half, the run above says nothing about the design decision.
      - name: the same scenario with consensus on the request path, which must break
        run: ./scripts/kill-leader.sh --control

  case-study:
    name: The commands the case study publishes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The development machine's Docker is Windows-side and unreachable from
      # the Linux shell the scripts run in, so the compose step can only be
      # exercised here. A published command nobody runs is a published command
      # that does not work. This job deliberately uses compose rather than
      # service containers, because compose is what the page tells readers to
      # run.
      - name: published commands, with docker
        run: ./scripts/case-study-commands-test.sh --with-docker
