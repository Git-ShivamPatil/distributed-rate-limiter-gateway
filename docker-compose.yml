services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      RATE_LIMIT_BACKEND: redis
      REDIS_ADDR: redis:6379
      RATE_LIMIT_CAPACITY: "20"
      RATE_LIMIT_REFILL_PER_SEC: "5"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Staged for an upcoming milestone -- not wired into the gateway yet.
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
